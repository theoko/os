# Log directories created at boot. Mode 1777 on app/ so a user session can
# append without root, the same way /tmp works — sticky bit keeps users from
# deleting each other's files.
d /var/log/teddyos            0755 root root -
d /var/log/teddyos/app        1777 root root -
d /var/log/teddyos/snapshots  0755 root root -
