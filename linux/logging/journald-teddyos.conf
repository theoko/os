# Persistent journal so "what happened last boot" survives a reboot.
#
# Debian's default is Storage=auto, which only persists when /var/log/journal
# already exists. Cloud images sometimes wipe or never create it; then every
# reboot throws away the only evidence of a failed first boot. We force
# persistent storage and cap the disk so a chatty box cannot fill the rootfs.
[Journal]
Storage=persistent
SystemMaxUse=512M
SystemKeepFree=1G
MaxRetentionSec=14day
Compress=yes
