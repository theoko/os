<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Grok launcher icon.

       Same tile geometry as Search / Claude / Gemini / Codex. Near-black
       tile (xAI palette) with a white six-point mark — readable at 48px
       without copying a trademark. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="62" y="62" width="900" height="900" rx="208" ry="208" fill="url(#tile)"/>
  <rect x="62" y="62" width="900" height="900" rx="208" ry="208" fill="url(#sheen)"/>

  <!-- Six-point spark: thick enough for small sizes. -->
  <path fill="#ffffff"
        d="M512 230 L560 420 L760 420 L598 538 L658 728 L512 610 L366 728 L426 538 L264 420 L464 420 Z"/>
</svg>
