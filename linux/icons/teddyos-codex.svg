<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Codex launcher icon.

       Same tile geometry as Search / Claude. Teal-green so it sits apart from
       Claude's clay and Gemini's violet. Brackets + bar = "code / document"
       without redrawing OpenAI's mark. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3DCFB0"/>
      <stop offset="100%" stop-color="#1A9A7A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="62" y="62" width="900" height="900" rx="208" ry="208" fill="url(#tile)"/>
  <rect x="62" y="62" width="900" height="900" rx="208" ry="208" fill="url(#sheen)"/>

  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="74">
    <!-- Left bracket -->
    <path d="M380 300 L280 512 L380 724"/>
    <!-- Right bracket -->
    <path d="M644 300 L744 512 L644 724"/>
    <!-- Centre bar -->
    <path d="M440 512 H584"/>
  </g>
</svg>
