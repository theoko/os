<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Antigravity — WhiteSur-style plate. -->
  <defs>
    <linearGradient id="a" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1A5FE0"/>
      <stop offset="100%" stop-color="#5B9BFF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="5" y="7" width="54" height="54" rx="13.5" fill="#000" opacity="0.10"/>
  <rect x="5" y="5" width="54" height="54" rx="13.5" fill="#ffffff" filter="url(#sh)"/>
  <rect x="5" y="5" width="54" height="54" rx="13.5" fill="none" stroke="#000" stroke-opacity="0.06" stroke-width="0.5"/>
  <!-- Upward lift chevrons -->
  <g fill="none" stroke="url(#a)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 38 L32 24 L44 38"/>
    <path d="M24 46 L32 36 L40 46"/>
