<!-- teddyOS bookmark bar.

     Replaces /usr/share/chromium/initial_bookmarks.html, which Debian's
     master_preferences imports on first run and which ships Debian.org,
     Latest News and Help. Those are three links about the distribution this
     was built from, on a machine that is not being sold as that distribution,
     and none of them is a thing anybody opens on a Tuesday.

     Named by what they are FOR, not by whose product they are: someone who has
     never set up a computer knows they want "Email" long before they know
     which company's email they have. The destinations are the ones most people
     actually land on, and every one of them is an ordinary editable bookmark —
     deleted or replaced in two clicks. This is a starting point, not a
     partnership.

     Deliberately six. A bar with fifteen items is a wall of favicons nobody
     reads; six fit without crowding at 800x600, which is the resolution this
     boots at in a virtual machine.
-->
