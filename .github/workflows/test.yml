name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Install image and emulator tools
        run: sudo apt-get update && sudo apt-get install --yes qemu-system-x86 xorriso
      - name: Run host, QEMU, and bridge checks
        run: make test
