[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "kernel"
path = "src/lib.rs"
test = true
doctest = false

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[features]
default = []
# Bare-metal image: no host is attached to COM2 and none ever will be, so the
# bridge probe is skipped rather than timing out before every action. Offline
# is already a modeled state everywhere, so this changes when the guest asks,
# not what it can do.
standalone = []

[dependencies]
limine = "0.5"

[build-dependencies]
ab_glyph = "0.2.32"
serde_json = "1.0.151"
