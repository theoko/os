# Timeout in seconds that Limine will use before automatically booting.
timeout: 0

# The entry name that will be displayed in the boot menu.
/os
    # We use the Limine boot protocol.
    protocol: limine

    # Path to the kernel to boot. boot():/ represents the partition on which limine.conf is located.
    path: boot():/boot/kernel

    # Boot resolution. The kernel reads its framebuffer once, from Limine's
    # handoff, and has no mode-setting driver - so this is the size it draws at
    # for the whole session. Resizing the VM window afterwards can only scale or
    # letterbox that; making the guest follow the window needs a display driver
    # (VBVA or virtio-gpu), which the Linux substrate provides instead.
    #
    # Set RESOLUTION=WxHxBPP when building to change it, e.g.
    #     make iso RESOLUTION=1920x1080x32
    #
    # Pick a mode the firmware actually offers. Limine falls back silently if
    # it cannot: 1600x1000x32 came up as 1024x768 with no warning, while
    # 800x600x32 and 1920x1080x32 were honoured exactly. Verified by reading
    # the size back out of a driven boot, not from the config.
    #
    # 1920x1080 is the practical ceiling: fb.rs sizes its back buffer at
    # MAX_W 1920 x MAX_H 1200 in .bss.
